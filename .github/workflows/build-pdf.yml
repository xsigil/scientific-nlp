name: Build PDF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # GitHub上のボタンから手動実行も可能

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Alpine Linux)
        run: |
          apk update
          apk add --no-cache \
            m4 \
            graphviz \
            gnuplot \
            librsvg-utils \
            gcc \
            musl-dev \
            make \
            curl \
            tar

      - name: Build and Install Pikchr
        run: |
          mkdir -p /tmp/pikchr-src
          curl -fsSL https://pikchr.org/home/tarball/trunk/pikchr.tar.gz | tar -xz -C /tmp/pikchr-src --strip-components=1
          cd /tmp/pikchr-src
          make pikchr
          mv pikchr /usr/local/bin/pikchr
          cd /
          rm -rf /tmp/pikchr-src

      - name: Build with Make
        run: |
          make

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the_seed_of_magic-pdf
          path: build/the_seed_of_magic.pdf
          retention-days: 30
