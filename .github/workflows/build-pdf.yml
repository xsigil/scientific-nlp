name: Build Bilingual PDFs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Alpine Linux)
        run: |
          apk update
          apk add --no-cache \
            m4 \
            graphviz \
            gnuplot \
            rsvg-convert \
            libgcc \
            gcc \
            musl-dev \
            make \
            curl \
            tar

      - name: Build and Install Pikchr
        run: |
          mkdir -p /tmp/pikchr-src
          curl -fsSL https://pikchr.org/home/tarball/trunk/pikchr.tar.gz | tar -xz -C /tmp/pikchr-src --strip-components=1
          cd /tmp/pikchr-src
          make pikchr
          mv pikchr /usr/local/bin/pikchr
          cd /
          rm -rf /tmp/pikchr-src

      - name: Verify Tools
        run: |
          which rsvg-convert
          rsvg-convert --version
          which pikchr
          which m4

      - name: Build All Language PDFs (Japanese & English)
        run: |
          make all

      - name: Upload Japanese PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the_seed_of_magic_ja-pdf
          path: build/the_seed_of_magic_ja.pdf
          retention-days: 30

      - name: Upload English PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the_seed_of_magic_en-pdf
          path: build/the_seed_of_magic_en.pdf
          retention-days: 30
