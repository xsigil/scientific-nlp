name: Build PDF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # GitHub上のボタンから手動実行も可能

jobs:
  build:
    runs-on: ubuntu-latest
    # Alpine Linux ベースの完全版 TeX Live コンテナ
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Alpine Linux)
        run: |
          apk update
          apk add --no-cache \
            m4 \
            graphviz \
            gnuplot \
            librsvg \
            gcc \
            musl-dev \
            curl

      - name: Build and Install Pikchr
        run: |
          curl -fsSL https://pikchr.org/home/raw/pikchr.c?m=trunk -o pikchr.c
          gcc -O2 -DPIKCHR_SHELL pikchr.c -o /usr/local/bin/pikchr -lm
          rm pikchr.c

      - name: Build with Make
        run: |
          make

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the_seed_of_magic-pdf
          path: build/the_seed_of_magic.pdf
          retention-days: 30
