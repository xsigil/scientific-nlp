<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 -250 500 500" width="100%" height="100%">
  <defs>
    <!-- 極限の無菌室を演出するディープスレート＆サイバネティクス発光グラデーション -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161f28" />
      <stop offset="100%" stop-color="#0a0e13" />
    </radialGradient>

    <!-- サイバネティクス・シアンの線形グラデーション -->
    <linearGradient id="orbit-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="orbit-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#11998e" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <!-- フラクタル反復エレメント（サークル・インバージョン＆三極共振） -->
    <g id="tri-branch">
      <!-- 基準となる対数螺旋・アポロニウス分岐アーム -->
      <circle cx="0" cy="-60" r="32" fill="none" stroke="url(#orbit-grad-1)" stroke-width="1.2" stroke-dasharray="180, 2" />
      <circle cx="0" cy="-60" r="19.78" fill="none" stroke="url(#orbit-grad-2)" stroke-width="0.9" />
      <circle cx="0" cy="-78" r="12.22" fill="none" stroke="#00f2fe" stroke-width="0.75" stroke-opacity="0.8" />
      <circle cx="0" cy="-48.8" r="7.55" fill="none" stroke="#38ef7d" stroke-width="0.6" stroke-opacity="0.7" />
      <circle cx="0" cy="-85.5" r="4.67" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.9" />
      
      <!-- 位相空間の接続線（ビーム物理の軌道束） -->
      <path d="M 0,-60 L 0,-95 M -20,-60 L 20,-60" stroke="#4facfe" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="0" cy="-90.17" r="2.88" fill="#00f2fe" />
      <circle cx="0" cy="-93.05" r="1.78" fill="#ffffff" />
    </g>

    <!-- 60度回転させた自己相似サブツリー -->
    <g id="sub-fractal">
      <use href="#tri-branch" />
      <use href="#tri-branch" transform="rotate(60) scale(0.618)" />
      <use href="#tri-branch" transform="rotate(-60) scale(0.618)" />
    </g>

    <!-- 3回転対称アセンブリ -->
    <g id="full-fractal">
      <use href="#sub-fractal" />
      <use href="#sub-fractal" transform="rotate(120)" />
      <use href="#sub-fractal" transform="rotate(240)" />
    </g>
  </defs>

  <!-- 背景：ダークスレート基調 -->
  <rect x="-250" y="-250" width="500" height="500" fill="url(#bg-glow)" rx="32" />

  <!-- 外殻：位相空間の境界条件（アポロニウスの球充填外枠） -->
  <circle cx="0" cy="0" r="200" fill="none" stroke="#2c3b4d" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="0" cy="0" r="196" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="2, 6" />
  <circle cx="0" cy="0" r="123.6" fill="none" stroke="#38ef7d" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="1, 4" />
  
  <!-- 外周の測地線・位相幾何学マーカー（3極＝三代仏教・認知・物理） -->
  <circle cx="0" cy="-200" r="3" fill="#00f2fe" />
  <circle cx="173.2" cy="100" r="3" fill="#00f2fe" />
  <circle cx="-173.2" cy="100" r="3" fill="#00f2fe" />
  
  <path d="M 0,-200 L 173.2,100 L -173.2,100 Z" fill="none" stroke="#4facfe" stroke-width="0.4" stroke-opacity="0.2" />

  <!-- フラクタル本体：レイヤー1（マクロ構造） -->
  <use href="#full-fractal" />

  <!-- フラクタル本体：レイヤー2（黄金比スケールダウン・ミクロ位相共振） -->
  <g transform="rotate(30) scale(0.382)">
    <use href="#full-fractal" />
  </g>

  <!-- フラクタル本体：レイヤー3（自己相似特異点への極限収束） -->
  <g transform="rotate(15) scale(0.146)">
    <use href="#full-fractal" />
  </g>

  <!-- 特異点コア：脱同一化・Egoの消滅点（原点 O） -->
  <circle cx="0" cy="0" r="14" fill="none" stroke="url(#core-glow)" stroke-width="1.2" />
  <circle cx="0" cy="0" r="6" fill="#ffffff" />
  <circle cx="0" cy="0" r="3" fill="#00f2fe" />

  <!-- ロゴタイプ：Scientific NLP™（学術上製本フォントライクな骨格） -->
  <text x="0" y="218" 
        text-anchor="middle" 
        font-family="'Latin Modern Roman', 'Times New Roman', 'Cinzel', serif" 
        font-size="16" 
        letter-spacing="0.38em" 
        fill="#e2e8f0" 
        font-weight="bold"
        opacity="0.95">SCIENTIFIC NLP<tspan font-size="9" dy="-6" letter-spacing="0">™</tspan></text>

  <text x="0" y="235" 
        text-anchor="middle" 
        font-family="'JetBrains Mono', 'Fira Code', monospace" 
        font-size="6.8" 
        letter-spacing="0.32em" 
        fill="#00f2fe" 
        opacity="0.75">DETERMINISTIC COGNITIVE DYNAMICS</text>
</svg>
